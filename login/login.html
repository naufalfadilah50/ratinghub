<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RatingHub - Masuk</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="overlay"></div>
            <div class="hero-content">
                <div class="badge">Selamat Datang di RatingHub</div>
                <h1>Ulas Film <br><span>Terbaikmu</span></h1>
                <p>Bergabunglah dengan komunitas pencinta film. Temukan, simpan, dan berikan penilaian pada film-film favoritmu dari seluruh dunia.</p>
            </div>
        </div>

        <div class="login-section">
            <div class="login-box">
                <h2>RatingHub</h2>
                <p class="subtitle">Masuk untuk melanjutkan pengalamanmu.</p>

                <!-- DITAMBAHKAN: action dan method -->
                <form action="proses_login.php" method="POST">
                    
                    <div class="input-group">
                        <label for="email">Email</label>
                        <!-- DITAMBAHKAN: name="email" dan required -->
                        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Kata Sandi</label>
                        <!-- DITAMBAHKAN: name="password" dan required -->
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="options">
                        <label class="checkbox-container">
                            <input type="checkbox"> Ingat Saya
                        </label>
                        <a href="forgot/forgot.html" class="forgot-password">Lupa sandi?</a>
                    </div>

                    <button type="submit" class="btn-login">Masuk</button>
                </form>

                <p class="footer-text">Belum punya akun? <a href="register/register.html">Daftar sekarang</a></p>
            </div>
        </div>
    </div>
    <!-- File login.js sengaja dihapus agar tidak memblokir proses PHP -->
</body>
</html>
